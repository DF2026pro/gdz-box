<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Коробки — Решу Домашку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12142b;          /* фон: чернильный синий, как тёмная карточка бота */
    --panel: #1c2046;
    --line: #2d3266;
    --text: #eef0ff;
    --soft: #a3a9d6;
    --go: #7df0c8;           /* мятный из карточек ответов — цвет действия */
    --go-ink: #0c2a22;
    --r0: #4b69ff; --r1: #8847ff; --r2: #d32ce6; --r3: #eb4b4b; --r4: #ffc83d;
    --win: var(--r0);
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body);
               font-size: 16px; line-height: 1.45; overscroll-behavior: none; }
  body { padding: 18px 0 calc(28px + env(safe-area-inset-bottom)); min-height: 100vh;
         max-width: 520px; margin: 0 auto; }   /* на компьютере — колонка как на телефоне */
  .pad { padding: 0 18px; }
  h1, h2, p { margin: 0; }

  /* ── баланс ── */
  .wallet { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .wallet .sum { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.02em; }
  .wallet .sum small { font-size: 22px; font-weight: 500; margin-left: 4px; }
  .wallet .cap { color: var(--soft); font-size: 14px; margin-bottom: 6px; }
  .cashout { font: 800 14px var(--display); letter-spacing: -0.01em; color: var(--ink); background: var(--text); border: 0;
             border-radius: 12px; padding: 12px 16px; white-space: nowrap; box-shadow: 0 4px 0 #9aa0cf;
             transition: transform .08s, box-shadow .08s; }
  .cashout:active { transform: translateY(3px); box-shadow: 0 1px 0 #9aa0cf; }
  .cashout:disabled { background: var(--panel); color: var(--soft); box-shadow: none; }

  /* ── экран вывода ── */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--ink); overflow-y: auto;
           padding: 18px 18px calc(28px + env(safe-area-inset-bottom)); }
  .sheet .in { max-width: 484px; margin: 0 auto; }
  .sheet .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sheet h1 { font: 800 22px var(--display); letter-spacing: -0.02em; }
  .sheet .close { font: 600 15px var(--body); color: var(--soft); background: none; border: 0; padding: 8px 0 8px 12px; }
  .sheet .have { margin-top: 6px; color: var(--soft); }
  .sheet .have b { color: var(--text); font-weight: 600; }
  .way { display: block; width: 100%; text-align: left; margin-top: 12px; padding: 14px 16px; border-radius: 14px;
         background: var(--panel); border: 2px solid transparent; color: var(--text); font: 400 16px var(--body); }
  .way b { display: block; font-weight: 600; }
  .way span { display: block; color: var(--soft); font-size: 14px; margin-top: 2px; }
  .way.on { border-color: var(--go); }
  .way:disabled { opacity: .5; }
  .way:focus-visible, .sheet input:focus-visible, .sheet .close:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .field { display: block; margin-top: 14px; font-size: 14px; color: var(--soft); }
  .field input { display: block; width: 100%; margin-top: 6px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
                 background: #0c0e22; color: var(--text); font: 400 17px var(--body); }
  .field input::placeholder { color: #5f6594; }
  .err { margin-top: 10px; color: #ff8f8f; font-size: 15px; min-height: 22px; }
  .need .bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 18px; }
  .need .bar span { display: block; height: 100%; background: var(--go); border-radius: 6px; }
  .need p { margin-top: 12px; }

  /* ── лента кейса ── */
  .case { margin: 22px 0 0; position: relative; }
  .window { position: relative; height: 148px; overflow: hidden; background: #0c0e22;
            border-top: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); }
  .window::before, .window::after { content: ""; position: absolute; top: 0; bottom: 0; width: 64px; z-index: 2; pointer-events: none; }
  .window::before { left: 0; background: linear-gradient(90deg, #0c0e22, transparent); }
  .window::after { right: 0; background: linear-gradient(270deg, #0c0e22, transparent); }
  .reel { position: absolute; top: 14px; left: 0; display: flex; gap: 8px; will-change: transform; }
  .card { flex: 0 0 96px; height: 120px; border-radius: 10px; background: var(--panel); position: relative;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
          border-bottom: 6px solid var(--c); overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: auto 0 0 0; height: 70%;
                  background: linear-gradient(0deg, color-mix(in srgb, var(--c) 38%, transparent), transparent); }
  .card b { position: relative; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; }
  .card i { position: relative; font-style: normal; font-size: 12px; color: var(--soft); }
  .card.won { outline: 2.5px solid var(--c); box-shadow: 0 0 34px color-mix(in srgb, var(--c) 70%, transparent); z-index: 1; }
  .needle { position: absolute; left: 50%; top: -7px; bottom: -7px; width: 3px; margin-left: -1.5px; background: var(--go); z-index: 3; border-radius: 2px; }
  .needle::before, .needle::after { content: ""; position: absolute; left: 50%; margin-left: -8px; border: 8px solid transparent; }
  .needle::before { top: 0; border-top-color: var(--go); }
  .needle::after { bottom: 0; border-bottom-color: var(--go); }
  .locked .needle { display: none; }
  .locked .reel { animation: drift 150s linear infinite alternate; }
  @keyframes drift { to { transform: translateX(-5600px); } }
  @media (prefers-reduced-motion: reduce) { .locked .reel { animation: none; } }

  /* ── итог ── */
  .result { min-height: 58px; margin-top: 16px; text-align: center; }
  .result .big { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--win); letter-spacing: -0.01em; }
  .result .hint { color: var(--soft); font-size: 15px; }
  .result .lead { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.25; letter-spacing: -0.01em; }
  .result .lead + .hint { margin-top: 6px; }

  /* ── кнопки ── */
  .primary { display: block; width: 100%; margin-top: 10px; padding: 17px 16px; border: 0; border-radius: 16px;
             font: 800 17px var(--display); letter-spacing: -0.01em; color: var(--go-ink); background: var(--go);
             box-shadow: 0 5px 0 #3fae8c; transition: transform .08s, box-shadow .08s; }
  .primary:active { transform: translateY(4px); box-shadow: 0 1px 0 #3fae8c; }
  .primary:disabled { background: var(--line); color: var(--soft); box-shadow: 0 5px 0 #1f2350; }
  .primary:focus-visible, .cashout:focus-visible, .invite:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .invite { display: block; width: 100%; margin-top: 14px; padding: 14px; border-radius: 16px; background: none;
            border: 1.5px solid var(--line); color: var(--text); font: 600 16px var(--body); }

  /* ── друзья ── */
  .friends { margin-top: 26px; }
  .friends h2, .odds h2, .wins h2 { font: 500 15px var(--display); margin-bottom: 10px; }
  .slots { display: flex; gap: 8px; }
  .slot { flex: 1; height: 12px; border-radius: 6px; background: var(--line); }
  .slot.on { background: var(--go); }
  .friends p { margin-top: 9px; color: var(--soft); font-size: 15px; }

  /* ── шансы ── */
  .odds { margin-top: 28px; }
  .odds ul, .wins ul { list-style: none; margin: 0; padding: 0; }
  .odds li { display: grid; grid-template-columns: 14px 1fr auto auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .odds li:last-child { border-bottom: 0; }
  .odds .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
  .odds .amt { font-family: var(--display); font-weight: 500; font-size: 15px; }
  .odds .pct { color: var(--soft); font-size: 14px; min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

  .fund { margin-top: 26px; }
  .fund .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .fund .bar span { display: block; height: 100%; background: var(--r4); border-radius: 5px; }
  .fund p { margin-top: 8px; color: var(--soft); font-size: 15px; }
  .fund p b { color: var(--text); font-weight: 600; }

  .wins { margin-top: 28px; }
  .wins li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 15px; }
  .wins li span:last-child { font-family: var(--display); font-weight: 500; color: var(--c); }
  .note { margin-top: 26px; color: var(--soft); font-size: 13px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .primary { transition: none; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<header class="pad wallet">
  <div>
    <p class="cap">На балансе</p>
    <p class="sum"><span id="bal">0</span><small>₽</small></p>
  </div>
  <button class="cashout" id="cashout" type="button">Вывести</button>
</header>

<div class="sheet" id="sheet" hidden>
  <div class="in">
    <div class="top"><h1>Вывод денег</h1><button class="close" id="sheetClose" type="button">Закрыть</button></div>
    <p class="have">На балансе <b id="sheetBal"></b></p>

    <div class="need" id="needBox" hidden>
      <div class="bar"><span id="needBar"></span></div>
      <p id="needText"></p>
      <button class="primary" id="needInvite" type="button">Позвать друзей</button>
    </div>

    <div id="waysBox" hidden>
      <div id="ways"></div>
      <div id="cardForm" hidden>
        <label class="field">Номер телефона для перевода по СБП
          <input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 123 456 78 90"></label>
        <label class="field">Банк
          <input id="fBank" type="text" autocomplete="off" placeholder="Сбер"></label>
        <label class="field">Имя получателя
          <input id="fName" type="text" autocomplete="name" placeholder="Иван И."></label>
      </div>
      <p class="err" id="sheetErr" role="alert"></p>
      <button class="primary" id="sheetSend" type="button">Отправить заявку</button>
    </div>
  </div>
</div>

<section class="case" id="case" aria-live="polite">
  <div class="window">
    <div class="reel" id="reel"></div>
    <div class="needle"></div>
  </div>
  <div class="pad">
    <div class="result" id="result"></div>
    <button class="primary" id="main" type="button">Открыть коробку</button>
    <button class="invite" id="invite" type="button">Позвать друзей</button>
  </div>
</section>

<section class="pad friends">
  <h2>До следующей коробки</h2>
  <div class="slots" id="slots"></div>
  <p id="friendsText"></p>
</section>

<section class="pad odds">
  <h2>Что бывает в коробке</h2>
  <ul id="odds"></ul>
</section>

<section class="pad fund">
  <div class="bar"><span id="fundBar"></span></div>
  <p id="fundText"></p>
</section>

<section class="pad wins" id="winsBox" hidden>
  <h2>Недавно выиграли</h2>
  <ul id="wins"></ul>
</section>

<p class="pad note" id="note"></p>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var COLORS = ["var(--r0)", "var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)"];
  var HEX = ["#4b69ff", "#8847ff", "#d32ce6", "#eb4b4b", "#ffc83d"];
  var CARD = 96, GAP = 8, STEP = CARD + GAP, WIN_AT = 58, TOTAL = 74;

  // Данные приходят от бота в адресе (?d=…). Без них — показ-пример.
  function readData() {
    try {
      var raw = new URLSearchParams(location.search).get("d");
      if (!raw) return null;
      raw = raw.replace(/-/g, "+").replace(/_/g, "/");
      var bin = atob(raw), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }
  var DEMO = { demo: 1, bal: 90, fr: 2, per: 3, nx: 1, pe: 1, bx: 1, pz: 1, fl: 7430, fu: 10000, mw: 300, wd: 0, 
               link: "", text: "", tasks: 2,
               tiers: [["Синяя", 30, 79.32], ["Фиолетовая", 60, 15.98], ["Розовая", 150, 3.2], ["Красная", 400, 1], ["Золотая", 1000, 0.5]],
               wins: [["Маша", 2, 150], ["Дима", 0, 30], ["Алина", 1, 60]] };
  var D = readData() || DEMO;
  var canSend = !!(tg && tg.sendData && tg.initData !== undefined && !D.demo);

  function rub(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function plural(n, a, b, c) { var m = n % 10, h = n % 100; return (m === 1 && h !== 11) ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? b : c; }
  function $(id) { return document.getElementById(id); }
  function haptic(kind, arg) { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind](arg); } catch (e) {} }

  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor("#12142b"); tg.setBackgroundColor("#12142b"); } catch (e) {}
  }

  // ── баланс, друзья, шансы, фонд ──
  $("bal").textContent = rub(D.bal);
  var cash = $("cashout");
  if (D.wd) { cash.textContent = "Заявка в работе"; cash.disabled = true; }

  var per = D.per || 3, filled = Math.max(0, per - D.nx);
  if (D.bx > 0) filled = per;
  for (var s = 0; s < per; s++) {
    var el = document.createElement("div"); el.className = "slot" + (s < filled ? " on" : ""); $("slots").appendChild(el);
  }
  $("friendsText").textContent = D.bx > 0
    ? "Коробка готова. Всего друзей засчитано: " + D.fr + "."
    : (D.nx === 1 ? "Нужен ещё " : "Нужно ещё ") + D.nx + " " + plural(D.nx, "друг", "друга", "друзей") + ". Друг засчитывается, когда решит " + (D.tasks || 2) + " задания."
      + (D.pe ? " Уже зашли, но ещё не решили: " + D.pe + "." : "");

  D.tiers.forEach(function (t, i) {
    var li = document.createElement("li"); li.style.setProperty("--c", COLORS[i % 5]);
    li.innerHTML = '<span class="dot"></span><span>' + t[0] + '</span><span class="amt">' + rub(t[1]) + ' ₽</span><span class="pct">' + String(t[2]).replace(".", ",") + ' %</span>';
    $("odds").appendChild(li);
  });

  $("fundBar").style.width = Math.max(0, Math.min(100, D.fl / D.fu * 100)) + "%";
  $("fundText").innerHTML = "В призовом фонде осталось <b>" + rub(D.fl) + " ₽</b> из " + rub(D.fu) + " ₽";

  if (D.wins && D.wins.length) {
    $("winsBox").hidden = false;
    D.wins.forEach(function (w) {
      var li = document.createElement("li"); li.style.setProperty("--c", COLORS[w[1] % 5]);
      var a = document.createElement("span"); a.textContent = w[0];
      var b = document.createElement("span"); b.textContent = rub(w[2]) + " ₽";
      li.appendChild(a); li.appendChild(b); $("wins").appendChild(li);
    });
  }
  var stale = !D.demo && D.t && (Date.now() / 1000 - D.t > 600);
  $("note").textContent = D.demo
    ? "Это пример. Открой коробки из бота: команда /box."
    : stale ? "Цифры могли устареть. Чтобы обновить, напиши боту /box и открой приложение заново."
            : "Приз выбирается случайно по шансам выше. Участие бесплатное.";
  if (stale) { $("note").style.color = "var(--r4)"; document.body.insertBefore($("note"), document.body.querySelector(".case")); $("note").style.margin = "14px 0 0"; }

  // ── лента ──
  // Три режима: «free» — бесплатная коробка-знакомство, «box» — коробка за друзей,
  // «wait» — коробки нет (зови друзей) или её пока нельзя открыть.
  var FREE = D.free && D.free.pz >= 0 ? D.free : null;
  var hasPrize = D.bx > 0 && D.pz >= 0;
  var mode = FREE ? "free" : hasPrize ? "box" : "wait";
  var R = mode === "free"
    ? FREE.t.map(function (t) { return { name: "Бесплатная", amount: t[0], chance: t[1], color: "var(--go)", hex: "#7df0c8" }; })
    : D.tiers.map(function (t, i) { return { name: t[0], amount: t[1], chance: t[2], color: COLORS[i % 5], hex: HEX[i % 5] }; });
  var prizeIdx = mode === "free" ? FREE.pz : D.pz;
  var total = R.reduce(function (a, t) { return a + t.chance; }, 0);
  function randomTier() {
    var x = Math.random() * total, acc = 0;
    for (var i = 0; i < R.length; i++) { acc += R[i].chance; if (x < acc) return i; }
    return 0;
  }
  var reel = $("reel");
  function card(i) {
    var c = document.createElement("div");
    c.className = "card"; c.style.setProperty("--c", R[i].color);
    c.innerHTML = "<b>" + rub(R[i].amount) + "</b><i>₽</i>";
    return c;
  }
  var cards = [];
  for (var k = 0; k < TOTAL; k++) {
    // в режиме ожидания показываем и редкие карточки — чтобы было видно, что бывает внутри
    var idx = (mode !== "wait" && k === WIN_AT) ? prizeIdx : (mode === "wait" && k % 7 === 5 ? 2 + (k % 3) : randomTier());
    var c = card(Math.min(idx, R.length - 1)); cards.push(c); reel.appendChild(c);
  }
  function offsetFor(index, shift) {
    var w = document.querySelector(".window").clientWidth;
    return -(index * STEP + CARD / 2 - w / 2 + (shift || 0));
  }
  reel.style.transform = "translateX(" + offsetFor(3) + "px)";

  var main = $("main"), result = $("result"), state = "idle";
  var WHY = {
    personal_day: "Сегодня ты уже открыл все свои коробки. Остальные откроются завтра, они не сгорят.",
    day: "На сегодня призы разыграны. Приходи завтра, коробка никуда не денется.",
    fund: "Призовой фонд разыгран, конкурс окончен. Деньги с баланса можно вывести.",
    off: "Конкурс сейчас не идёт."
  };
  var top = Math.max.apply(null, D.tiers.map(function (t) { return t[1]; }));
  function lead(big, small) {
    result.innerHTML = '<p class="lead"></p>' + (small ? '<p class="hint"></p>' : "");
    result.querySelector(".lead").textContent = big;
    if (small) result.querySelector(".hint").textContent = small;
  }

  if (mode === "free") {
    lead("Тебе бесплатная коробка", "Подарок за то, что пользуешься ботом. Внутри от " + rub(FREE.t[0][0]) + " до " + rub(FREE.t[FREE.t.length - 1][0]) + " ₽.");
    main.textContent = "Открыть бесплатно";
  } else if (mode === "box") {
    lead(D.bx > 1 ? "У тебя " + D.bx + " " + plural(D.bx, "коробка", "коробки", "коробок") : "Коробка готова", "Жми — лента покажет, что внутри. Бывает до " + rub(top) + " ₽.");
  } else {
    $("case").classList.add("locked");
    if (D.bx > 0 && D.why) {
      lead("Коробка ждёт", WHY[D.why] || "Её пока нельзя открыть.");
      main.hidden = true;
    } else {
      lead("Ещё " + D.nx + " " + plural(D.nx, "друг", "друга", "друзей") + " — и коробка твоя", "В каждой от " + rub(D.tiers[0][1]) + " до " + rub(top) + " ₽.");
      main.textContent = "Позвать друзей";
      $("invite").hidden = true;
      state = "invite";
    }
  }

  function spin() {
    state = "spinning"; main.disabled = true; main.textContent = "Крутим…"; result.innerHTML = "";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dur = reduce ? 600 : 6200;
    var shift = (Math.random() - 0.5) * (CARD - 22);
    var from = offsetFor(3), to = offsetFor(WIN_AT, shift), t0 = performance.now(), lastCell = -1;
    function ease(p) { return 1 - Math.pow(1 - p, 4.2); }
    function frame(now) {
      var p = Math.min(1, (now - t0) / dur), x = from + (to - from) * ease(p);
      reel.style.transform = "translateX(" + x + "px)";
      var cell = Math.floor(-x / STEP);
      if (cell !== lastCell) { lastCell = cell; haptic("selectionChanged"); }
      if (p < 1) requestAnimationFrame(frame); else done();
    }
    requestAnimationFrame(frame);
  }

  function done() {
    var t = R[prizeIdx];
    document.documentElement.style.setProperty("--win", t.hex);
    cards[WIN_AT].classList.add("won");
    result.innerHTML = '<p class="big"></p>' + (mode === "free" ? '<p class="hint"></p>' : "");
    result.querySelector(".big").textContent = t.name + " коробка: " + rub(t.amount) + " ₽";
    if (mode === "free") result.querySelector(".hint").textContent = "За каждых " + (D.per || 3) + " друзей — коробка до " + rub(top) + " ₽.";
    haptic("notificationOccurred", "success");
    if (mode === "free" || prizeIdx >= 2) confetti(t.hex);
    state = "won"; main.disabled = false;
    main.textContent = canSend ? "Забрать " + rub(t.amount) + " ₽" : "Забрать в боте: /box";
    if (!canSend) main.disabled = true;
  }

  function send(action) {
    if (!canSend) return false;
    try { tg.sendData(JSON.stringify({ a: action })); return true; } catch (e) { return false; }
  }
  function invite() {
    haptic("impactOccurred", "light");
    var url = "https://t.me/share/url?url=" + encodeURIComponent(D.link) + "&text=" + encodeURIComponent(D.text || "");
    if (tg && tg.openTelegramLink && D.link) { try { tg.openTelegramLink(url); return; } catch (e) {} }
    if (D.link) window.open(url, "_blank");
  }

  main.addEventListener("click", function () {
    if (state === "idle" && mode !== "wait") { haptic("impactOccurred", "medium"); spin(); }
    else if (state === "won") { main.disabled = true; if (!send(mode === "free" ? "free" : "open")) main.textContent = "Напиши боту /box"; }
    else if (state === "invite") invite();
  });
  $("invite").addEventListener("click", invite);
  // ── экран вывода: заявка оформляется здесь, боту уходит уже готовая ──
  // магазины: [название, [номиналы]] — выдаётся самый крупный номинал, на который хватает баланса
  // Если бот прислал список в старом виде или не прислал вовсе — показываем обычный набор
  var DEFAULT_SHOPS = [["Пятёрочка", [200, 250, 300, 500, 1000]], ["Перекрёсток", [200, 250, 300, 500, 1000, 1500, 2000]],
                       ["Ozon", [500, 1000, 2000, 3000]], ["Wildberries", [500, 1000, 2000, 3000]]];
  var SHOPS = (Array.isArray(D.sh) && D.sh.length && Array.isArray(D.sh[0]) && Array.isArray(D.sh[0][1])) ? D.sh : DEFAULT_SHOPS;
  function certFor(denoms) { var best = 0; denoms.forEach(function (d) { if (d <= D.bal && d > best) best = d; }); return best; }
  var certLeast = Infinity; SHOPS.forEach(function (sh) { sh[1].forEach(function (d) { if (d < certLeast) certLeast = d; }); });
  var chosen = null;
  function openSheet() {
    haptic("impactOccurred", "light");
    $("sheet").hidden = false; $("sheetBal").textContent = rub(D.bal) + " ₽"; $("sheetErr").textContent = "";
    var least = Math.min(D.mw, certLeast);
    if (D.bal < least) {
      $("needBox").hidden = false; $("waysBox").hidden = true;
      $("needBar").style.width = Math.max(3, Math.min(100, D.bal / least * 100)) + "%";
      $("needText").textContent = "Вывод — от " + rub(least) + " ₽. Не хватает " + rub(least - D.bal) + " ₽. За каждых "
        + (D.per || 3) + " друзей — коробка, в ней до " + rub(top) + " ₽.";
      return;
    }
    $("needBox").hidden = true; $("waysBox").hidden = false;
    var box = $("ways"); box.innerHTML = ""; chosen = null; $("cardForm").hidden = true;
    function way(id, title, sub, off) {
      var b = document.createElement("button"); b.type = "button"; b.className = "way"; b.disabled = !!off;
      var t = document.createElement("b"); t.textContent = title; var u = document.createElement("span"); u.textContent = sub;
      b.appendChild(t); b.appendChild(u);
      b.addEventListener("click", function () {
        chosen = id; haptic("selectionChanged");
        Array.prototype.forEach.call(box.children, function (x) { x.classList.remove("on"); });
        b.classList.add("on"); $("cardForm").hidden = id !== "card"; $("sheetErr").textContent = "";
        if (id === "card") $("fPhone").focus();
      });
      box.appendChild(b); return b;
    }
    var first = null;
    if (D.bal >= D.mw) first = way("card", "Перевод по номеру телефона", "Весь баланс: " + rub(D.bal) + " ₽");
    else way("card", "Перевод по номеру телефона", "От " + rub(D.mw) + " ₽", true);
    SHOPS.forEach(function (sh) {
      var shop = sh[0], sum = certFor(sh[1]), low = Math.min.apply(null, sh[1]);
      if (sum) {
        var w = way("cert:" + shop, "Сертификат " + shop, rub(sum) + " ₽ кодом в чат" + (D.bal - sum ? ". Остаток " + rub(D.bal - sum) + " ₽ останется на балансе" : ""));
        first = first || w;
      } else way("cert:" + shop, "Сертификат " + shop, "Если нет карты. От " + rub(low) + " ₽", true);
    });
    if (first) first.click();
  }
  function closeSheet() { $("sheet").hidden = true; }
  cash.addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("needInvite").addEventListener("click", invite);
  ["fPhone", "fBank", "fName"].forEach(function (id) { $(id).addEventListener("input", function () { $("sheetErr").textContent = ""; }); });
  $("sheetSend").addEventListener("click", function () {
    var err = $("sheetErr"), payload;
    if (!chosen) { err.textContent = "Выбери, как забрать деньги."; return; }
    if (chosen === "card") {
      var phone = $("fPhone").value.trim(), bank = $("fBank").value.trim(), name = $("fName").value.trim();
      if (phone.replace(/\D/g, "").length < 10) { err.textContent = "Впиши номер телефона полностью, 10–11 цифр."; $("fPhone").focus(); return; }
      if (!bank) { err.textContent = "Впиши банк, куда переводить."; $("fBank").focus(); return; }
      payload = { a: "wd", k: "card", d: (phone + " " + bank + (name ? ", " + name : "")).slice(0, 190) };
    } else payload = { a: "wd", k: "cert", s: chosen.slice(5) };
    if (!canSend) { err.textContent = "Заявка отправляется только из бота: открой приложение кнопкой внизу чата."; return; }
    $("sheetSend").disabled = true;
    try { tg.sendData(JSON.stringify(payload)); } catch (e) { $("sheetSend").disabled = false; err.textContent = "Не получилось отправить. Попробуй ещё раз."; }
  });

  // ── конфетти для редких коробок ──
  function confetti(color) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
    var parts = [], palette = [color, "#7df0c8", "#eef0ff"];
    for (var i = 0; i < 110; i++) parts.push({ x: W / 2, y: H * 0.34, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 3,
      s: 4 + Math.random() * 6, r: Math.random() * 6, c: palette[i % 3] });
    var t0 = performance.now();
    (function loop(now) {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) { p.vy += 0.34; p.x += p.vx; p.y += p.vy; p.r += 0.2;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s / 1.6); ctx.restore(); });
      if (now - t0 < 2600) requestAnimationFrame(loop); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }
})();
</script>
</body>
</html>
